<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="DSHChatMode">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6ef7"/>
      <stop offset="1" stop-color="#8a5cf6"/>
    </linearGradient>
    <linearGradient id="ring" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5cf6"/>
      <stop offset="1" stop-color="#4f6ef7"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- speech bubble -->
  <path d="M152 116
           H360
           A60 60 0 0 1 420 176
           V284
           A60 60 0 0 1 360 344
           H238
           L192 398
           Q180 410 180 392
           V344
           H152
           A60 60 0 0 1 92 284
           V176
           A60 60 0 0 1 152 116
           Z"
        fill="#ffffff"/>

  <!-- three typing dots -->
  <circle cx="176" cy="232" r="21" fill="#5a63f2"/>
  <circle cx="256" cy="232" r="21" fill="#5a63f2"/>
  <circle cx="336" cy="232" r="21" fill="#5a63f2"/>

  <!-- clock badge -->
  <circle cx="392" cy="376" r="82" fill="#ffffff" stroke="url(#ring)" stroke-width="14"/>
  <circle cx="392" cy="376" r="54" fill="none" stroke="#4f6ef7" stroke-width="12"/>
  <path d="M392 344 V376 L418 392" fill="none" stroke="#4f6ef7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
